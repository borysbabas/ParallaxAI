services:
  mariadb:
    image: mariadb:11
    container_name: dev_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: darktech
      MARIADB_USER: dev_user
      MARIADB_PASSWORD: darktech
    ports:
      - "3307:3306"   # Host port 3307 → container port 3306
    volumes:
      - mariadb_dev_data:/var/lib/mysql

volumes:
  mariadb_dev_data: